[profile.default]
default-filter = "not (binary(/^git_/) | test(/(^|::)git_tests::/) | binary(/^wsl_/) | binary(/^dogfood_/))"
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = "binary(/^dogfood_/)"
slow-timeout = { period = "60s", terminate-after = 40 }
