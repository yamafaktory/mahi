[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Davy Duperron <yamafaktory@gmail.com>"]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/yamafaktory/mahi"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "zeroize"] }
age = "0.11.5"
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bech32 = { version = "0.11.1", default-features = false, features = ["alloc"] }
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
bytes = { version = "1.12.1", default-features = false }
chacha20 = { version = "0.9.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
ghash = { version = "0.5.1", default-features = false, features = ["zeroize"] }
gix = { version = "0.88.0", default-features = false, features = ["attributes", "blocking-network-client", "excludes", "index", "pack-cache-lru-dynamic", "parallel", "sha1", "worktree-mutation"] }
gix-hash = "0.27.0"
gix-error = "0.4.0"
gix-features = { version = "0.50.0", default-features = false, features = ["io-pipe"] }
gix-pack = { version = "0.75.0", default-features = false, features = ["generate"] }
gix-transport = { version = "0.60.0", default-features = false, features = ["http-client"] }
gix-lock = "25.0.0"
gix-validate = "0.12.0"
hkdf = { version = "0.12.4", default-features = false }
hmac = { version = "0.12.1", default-features = false }
iroh = { version = "1.2.0", default-features = false }
iroh-gossip = { version = "0.101.0", default-features = false, features = ["net"] }
libc = { version = "0.2.189", default-features = false }
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
n0-future = { version = "0.3.2", default-features = false }
mahi-core = { path = "crates/mahi-core" }
mahi-http = { path = "crates/mahi-http" }
mahi-crypto = { path = "crates/mahi-crypto" }
mahi-identity = { path = "crates/mahi-identity" }
mahi-live = { path = "crates/mahi-live" }
mahi-proxy = { path = "crates/mahi-proxy" }
mahi-sandbox = { path = "crates/mahi-sandbox" }
mahi-schedule = { path = "crates/mahi-schedule" }
mahi-ssh = { path = "crates/mahi-ssh" }
mahi-store = { path = "crates/mahi-store" }
mahi-thread = { path = "crates/mahi-thread" }
mahi-tls = { path = "crates/mahi-tls" }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13.1", default-features = false, features = ["ecdsa"] }
polyval = { version = "0.6.2", default-features = false, features = ["zeroize"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = "1.11.0"
rsa = { version = "0.9.10", default-features = false, features = ["u64_digit"] }
rustix = { version = "1.1.5", default-features = false, features = ["event", "fs", "mount", "net", "pipe", "process", "pty", "std", "termios", "thread"] }
russh = { version = "0.63.3", default-features = false, features = ["rustcrypto"] }
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
sha1 = { version = "0.10.6", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "0.10.9", default-features = false, features = ["oid"] }
signature = "2.2.0"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "std"] }
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.18", default-features = false, features = ["net"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
vt100 = "0.16.2"
webpki-roots = "1.0.9"
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1.9.0"

[patch.crates-io]
russh = { git = "https://github.com/ToyOSOrg/russh", rev = "15eb197d28f12a4c6ac573850458545457f7bf55" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "forbid", priority = -1 }
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
unsafe_code = "deny"
unused_imports = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev.package."*"]
opt-level = 2
