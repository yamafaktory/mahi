[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Davy Duperron <yamafaktory@gmail.com>"]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/yamafaktory/mahi"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
age = "0.12.1"
bech32 = { version = "0.11.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.2.0", default-features = false }
getrandom = "0.4.3"
gix = { version = "0.88.0", default-features = false, features = ["attributes", "excludes", "index", "pack-cache-lru-dynamic", "parallel", "sha1", "worktree-mutation"] }
gix-hash = "0.27.0"
gix-lock = "25.0.0"
gix-validate = "0.12.0"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
mahi-core = { path = "crates/mahi-core" }
mahi-crypto = { path = "crates/mahi-crypto" }
mahi-identity = { path = "crates/mahi-identity" }
mahi-sandbox = { path = "crates/mahi-sandbox" }
mahi-schedule = { path = "crates/mahi-schedule" }
mahi-store = { path = "crates/mahi-store" }
mahi-thread = { path = "crates/mahi-thread" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = "1.11.0"
rustix = { version = "1.1.5", default-features = false, features = ["event", "fs", "process", "pty", "std", "termios"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
sha2 = { version = "0.10.9", default-features = false }
signature = "2.2.0"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "std"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
x25519-dalek = { version = "2.0.1", default-features = false }
zeroize = "1.9.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "forbid", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_imports = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev.package."*"]
opt-level = 2
