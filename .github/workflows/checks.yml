name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt-check

  clippy:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just clippy

  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - if: runner.os == 'Linux'
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile mahi-tests %s/target/** flags=(unconfined) {\n  userns,\n}\n' "$GITHUB_WORKSPACE" | sudo tee /etc/apparmor.d/mahi-tests
          sudo apparmor_parser -r /etc/apparmor.d/mahi-tests
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends openssh-server
      - run: just test --profile ci
      - run: just test-git --profile ci
      - if: runner.os == 'Linux'
        run: just apparmor-parse

  wsl:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: build-essential curl git openssh-server
      - shell: wsl-bash -u root {0}
        run: |
          uname -r
          wslinfo --networking-mode || true
          start=$(date +%s%N)
          timeout 60 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1' || echo "closed loopback port: exit $?"
          echo "closed loopback port answered in $(( ($(date +%s%N) - start) / 1000000 )) ms"
          useradd --create-home tester
          git -c safe.directory='*' clone --quiet . /home/tester/mahi
          chown -R tester: /home/tester/mahi
      - shell: wsl-bash -u tester {0}
        run: |
          export PATH="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          cd ~/mahi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . ~/.cargo/env
          rustup toolchain install
          curl --proto '=https' --tlsv1.2 -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to ~/.cargo/bin
          cargo nextest run --workspace --locked --no-run
          (cargo nextest run --locked -p mahi -E 'test(taking_a_thread_from_the_remote)' --no-capture &
            sleep 90
            ps -eo pid,ppid,stat,wchan:32,etime,args --forest | grep -v ' \[' || true
            for p in $(pgrep -f 'debug/mahi '); do
              echo "== $p: $(tr '\0' ' ' < /proc/$p/cmdline)"
              ls -l /proc/$p/fd || true
              for t in /proc/$p/task/*; do echo "$(cat $t/comm) $(cat $t/wchan)"; done
            done
            wait) || true
          just test --profile ci
          just test-git --profile ci
          just test-wsl --profile ci --success-output final

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deb
      - run: just deb
      - run: just deb-check

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - run: just deny

  fuzz:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: just fuzz-all 20
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
