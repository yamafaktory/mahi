[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
deny = [
    { name = "aws-lc-rs", reason = "builds C code; TLS uses mahi-tls" },
    { name = "aws-lc-sys", reason = "builds C code; TLS uses mahi-tls" },
    { name = "openssl-sys", reason = "binds a C library" },
    { name = "ring", reason = "builds C code; TLS uses mahi-tls" },
]
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
