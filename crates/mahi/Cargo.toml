[package]
authors.workspace = true
description = "Real-time, peer-to-peer collaboration around any terminal coding agent"
edition.workspace = true
license.workspace = true
name = "mahi"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.dist]
dist = true

[package.metadata.deb]
assets = [
  ["target/release/mahi", "usr/bin/", "755"],
  ["../../packaging/deb/usr.bin.mahi", "etc/apparmor.d/", "644"],
]
conf-files = ["/etc/apparmor.d/usr.bin.mahi"]
breaks = "apparmor (<< 4.0~)"
depends = "$auto"
license-file = ["../../LICENSE", "0"]
extended-description = "mahi runs a terminal coding agent in a sandbox and shares its thread with teammates in real time. The package installs an AppArmor profile that lets /usr/bin/mahi create the user namespaces its sandbox needs and confines it in no other way."
maintainer-scripts = "../../packaging/deb/"
priority = "optional"
section = "devel"

[dependencies]
age = { workspace = true }
clap = { workspace = true }
getrandom = { workspace = true }
mahi-agent = { workspace = true }
mahi-core = { workspace = true }
mahi-crypto = { workspace = true }
mahi-http = { workspace = true }
mahi-identity = { workspace = true }
mahi-live = { workspace = true }
mahi-proxy = { workspace = true }
mahi-sandbox = { workspace = true }
mahi-schedule = { workspace = true }
mahi-ssh = { workspace = true }
mahi-store = { workspace = true }
mahi-term = { workspace = true }
mahi-thread = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ssh-key = { workspace = true }
subtle = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
vt100 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
gix = { workspace = true }
libc = { workspace = true }
signature = { workspace = true }
ssh-key = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
