[package]
authors.workspace = true
description = "mahi's SSH transport: git remotes over SSH, with host keys from known_hosts and keys from ssh-agent."
edition.workspace = true
license.workspace = true
name = "mahi-ssh"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
fuzzing = []

[dependencies]
aes = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chacha20 = { workspace = true }
ghash = { workspace = true }
getrandom = { workspace = true }
gix = { workspace = true }
hmac = { workspace = true }
mahi-core = { workspace = true }
mahi-identity = { workspace = true }
ml-kem = { workspace = true }
poly1305 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
signature = { workspace = true }
ssh-key = { workspace = true, features = ["p256", "p384"] }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net"] }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
mahi-store = { workspace = true }
ml-kem = { workspace = true, features = ["hazmat"] }
proptest = { workspace = true }
ssh-key = { workspace = true, features = ["getrandom", "p256", "p384"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "process", "rt-multi-thread"] }
tokio-stream = { workspace = true }

[lints]
workspace = true
