[package]
name = "mahi-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
age = { version = "0.11.5", default-features = false }
libfuzzer-sys = "0.4.13"
mahi-agent = { path = "../crates/mahi-agent" }
mahi-core = { path = "../crates/mahi-core" }
mahi-crypto = { path = "../crates/mahi-crypto" }
mahi-http = { path = "../crates/mahi-http" }
mahi-identity = { path = "../crates/mahi-identity" }
mahi-live = { path = "../crates/mahi-live" }
mahi-proxy = { path = "../crates/mahi-proxy" }
mahi-ssh = { path = "../crates/mahi-ssh" }
mahi-store = { path = "../crates/mahi-store" }
mahi-term = { path = "../crates/mahi-term" }
mahi-thread = { path = "../crates/mahi-thread" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "briefing"
path = "fuzz_targets/briefing.rs"
test = false
doc = false
bench = false

